name: DCC-EX native turnout regression

on:
  push:
    branches:
      - feature/dccex-turnout-id
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-turnout-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows/Linux Hub backend
        run: dotnet build desktop/DCCExpressHub.Net/DCCExpressHub.Net.csproj --configuration Release
      - name: Native turnout feedback regression
        run: dotnet run --project desktop/DCCExpressHub.Net.Tests/DCCExpressHub.Net.Tests.csproj --configuration Release

  native-turnout-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web-ui
      - name: Typecheck and build web UI
        run: npm run build --prefix web-ui
      - name: Native turnout and legacy VPIN regression
        run: node --test web-ui/tests/dccex-vpin-output.test.mjs
      - name: Full frontend regression suite (feature)
        shell: bash
        run: |
          npm test --prefix web-ui > "$RUNNER_TEMP/dccex-feature-tests.tap" 2>&1 || true
          tail -n 8 "$RUNNER_TEMP/dccex-feature-tests.tap"
      - name: Check full-suite regression against unchanged alpha7
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin alpha7
          git worktree add --detach "$RUNNER_TEMP/dccex-alpha7" FETCH_HEAD
          npm ci --prefix "$RUNNER_TEMP/dccex-alpha7/web-ui"
          npm test --prefix "$RUNNER_TEMP/dccex-alpha7/web-ui" > "$RUNNER_TEMP/dccex-alpha7-tests.tap" 2>&1 || true
          node web-ui/tools/compare-test-baseline.mjs "$RUNNER_TEMP/dccex-feature-tests.tap" "$RUNNER_TEMP/dccex-alpha7-tests.tap"

name: DCCExpressHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0-alpha.1)
        required: true

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install web UI dependencies
        run: npm ci --prefix web-ui

      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"

          npm version "$version" \
            --prefix web-ui \
            --no-git-tag-version \
            --allow-same-version

      - name: Build web UI
        run: npm run build --prefix web-ui

      - name: Prepare LittleFS data
        run: node prepare-littlefs.mjs

      - name: Build all firmware targets
        shell: bash
        run: |
          set -euo pipefail

          targets=(
            "m5stack-basic-dccex"
            "m5stack-basic-z21"
            "esp32dev-dccex"
            "esp32dev-z21"
            "waveshare-s3-lcd7-dccex"
            "waveshare-s3-lcd7-z21"
          )

          for target in "${targets[@]}"; do
            echo "== Building $target =="

            pio run -e "$target"
            pio run -e "$target" -t buildfs

            node tools/firmware/merge-firmware.mjs \
              --env "$target"
          done

      - name: Verify merged firmware set
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"

          expected=(
            "dist/firmware/DCCExpressHub-M5Stack-Basic-DCCEX-v${version}-merged.bin"
            "dist/firmware/DCCExpressHub-M5Stack-Basic-Z21-v${version}-merged.bin"
            "dist/firmware/DCCExpressHub-ESP32-DevKit-DCCEX-v${version}-merged.bin"
            "dist/firmware/DCCExpressHub-ESP32-DevKit-Z21-v${version}-merged.bin"
            "dist/firmware/DCCExpressHub-Waveshare-S3-LCD7-DCCEX-v${version}-merged.bin"
            "dist/firmware/DCCExpressHub-Waveshare-S3-LCD7-Z21-v${version}-merged.bin"
          )

          mkdir -p artifacts/release

          for file in "${expected[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing merged firmware: $file"
              exit 1
            fi

            echo "$(stat -c '%s' "$file") bytes  $file"

            cp "$file" artifacts/release/
          done

      - name: Upload merged firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-firmware-release
          path: artifacts/release/DCCExpressHub-*-merged.bin
          if-no-files-found: error

  github-release:
    needs: firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: merged-firmware-release
          path: release

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"
          prerelease_flag=""

          if [[ "$version" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create \
            "v$version" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DCCExpressHub v$version" \
            --generate-notes \
            $prerelease_flag

name: DCCExpressHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          version="$(tr -d '\r\n' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "$version" ]]; then
            echo "::error::VERSION is empty"
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "::error::Invalid VERSION: $version"
            exit 1
          fi

          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::VERSION ($version) does not match tag ($tag_version)"
            exit 1
          fi

          echo "Release version verified: $version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install web UI dependencies
        run: npm ci --prefix web-ui

      - name: Sync web UI package version
        shell: bash
        run: |
          set -euo pipefail

          npm version "$RELEASE_VERSION" \
            --prefix web-ui \
            --no-git-tag-version \
            --allow-same-version

      - name: Build web UI
        run: npm run build --prefix web-ui

      - name: Prepare LittleFS data
        run: node prepare-littlefs.mjs

      - name: Build official DCC-EX release firmware targets
        shell: bash
        run: |
          set -euo pipefail

          targets=(
            "m5stack-basic-dccex"
            "esp32dev-dccex"
          )

          for target in "${targets[@]}"; do
            echo "== Building $target =="

            pio run -e "$target"
            pio run -e "$target" -t buildfs

            node tools/firmware/merge-firmware.mjs \
              --env "$target"
          done

      - name: Verify merged firmware set
        shell: bash
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"

          expected=(
            "dist/firmware/DCCExpressHub-M5Stack-Basic-DCCEX-v${version}-merged.bin"
            "dist/firmware/DCCExpressHub-ESP32-DevKit-DCCEX-v${version}-merged.bin"
          )

          mkdir -p artifacts/release

          for file in "${expected[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing merged firmware: $file"
              exit 1
            fi

            echo "$(stat -c '%s' "$file") bytes  $file"
            cp "$file" artifacts/release/
          done

      - name: Upload merged firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-firmware-release
          path: artifacts/release/DCCExpressHub-*-DCCEX-v*-merged.bin
          if-no-files-found: error

  github-release:
    needs: firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: merged-firmware-release
          path: release

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          prerelease_flag=""

          if [[ "$version" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create \
            "v$version" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DCCExpressHub v$version" \
            --generate-notes \
            --verify-tag \
            $prerelease_flag

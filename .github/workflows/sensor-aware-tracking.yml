name: Sensor-aware tracking build

on:
  push:
    branches:
      - feature/sensor-aware-tracking
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build .NET backend
        run: dotnet build desktop/DCCExpressHub.Net/DCCExpressHub.Net.csproj -c Release

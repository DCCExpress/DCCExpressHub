name: Sensor-aware tracking build

on:
  push:
    branches:
      - feature/sensor-aware-tracking
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build .NET backend
        run: dotnet build desktop/DCCExpressHub.Net/DCCExpressHub.Net.csproj -c Release

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix web-ui
      - name: Type-check and build web UI
        run: npm run build --prefix web-ui
      - name: Route regression tests
        run: npm run test:routes --prefix web-ui

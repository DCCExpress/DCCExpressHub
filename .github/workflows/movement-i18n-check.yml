name: Movement i18n check

on:
  push:
    branches:
      - "fix/movement-editor-i18n-20260929"
    paths:
      - ".github/workflows/movement-i18n-check.yml"

permissions:
  contents: read

jobs:
  web-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web-ui

      - name: Run tests
        run: npm test --prefix web-ui

      - name: Build web UI
        run: npm run build --prefix web-ui

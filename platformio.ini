; Waveshare ESP32-S3-Touch-LCD-7 (HESTORE 27078 variant: 16 MB flash / 8 MB OPI PSRAM)
; Existing environments above intentionally stay on PlatformIO espressif32 6.12.0.
[env:waveshare-s3-lcd7-dccex]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions/waveshare-s3-lcd7-16mb.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    adafruit/Adafruit GFX Library @ ^1.12.1
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0

build_src_filter =
    +<*>
    -<Z21CommandCenter.cpp>
    -<CommandCenterManager.cpp>
    -<CommandCenterFactory.cpp>

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -D HUB_USE_DISPLAY=1
    -D HUB_DISPLAY_WAVESHARE_S3_LCD7=1
    -D HUB_TARGET_WAVESHARE_S3_LCD7=1
    -D HUB_CC_DCCEX=1
    -D S88_I2C_ENABLED=1
    -D S88_I2C_SDA_PIN=8
    -D S88_I2C_SCL_PIN=9
    -D S88_I2C_CLOCK_HZ=100000UL
    -I src



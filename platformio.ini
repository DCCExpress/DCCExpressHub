[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D HUB_USE_DISPLAY=0

[env:m5stack-basic]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    m5stack/M5Unified

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D HUB_USE_DISPLAY=1
    -D HUB_DISPLAY_M5STACK_BASIC=1

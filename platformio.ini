[env:waveshare-s3-lcd7-dccex]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

debug_tool = esp-builtin
debug_init_break = tbreak setup

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    https://github.com/lovyan03/LovyanGFX.git#fb7cec222726b92676e26126246d59f70f04ced2
    https://github.com/binzume/esp32quickjs.git#2020-11-08_esp32

build_src_filter =
    +<*>
    -<Z21CommandCenter.cpp>
    -<CommandCenterManager.cpp>
    -<CommandCenterFactory.cpp>

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D HUB_USE_DISPLAY=1
    -D HUB_DISPLAY_WAVESHARE_S3_LCD7=1
    -D HUB_TARGET_WAVESHARE_S3_LCD7=1
    -D HUB_JS_SANDBOX=1
    -D HUB_CC_DCCEX=1


[env:sunton-8048s043-dccex]
; Arduino-ESP32 3.1.1 / ESP-IDF 5.3.2 via pioarduino.
; This target is isolated from the other DCCExpressHub environments.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Espressif high-performance SDK matching Arduino-ESP32 3.1.1.
; The -h SDK enables, among other things:
;   CONFIG_COMPILER_OPTIMIZATION_PERF=y
;   CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
; and on ESP32-S3R8 enables PSRAM XIP support.
platform_packages =
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip

monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ESP32-S3 N16R8: QIO flash + Octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.maximum_size = 16777216

debug_tool = esp-builtin
debug_init_break = tbreak setup

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    moononournation/GFX Library for Arduino @ 1.5.6
    https://github.com/binzume/esp32quickjs.git#2020-11-08_esp32

build_src_filter =
    +<*>
    -<Z21CommandCenter.cpp>
    -<CommandCenterManager.cpp>
    -<CommandCenterFactory.cpp>

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D HUB_USE_DISPLAY=1
    -D HUB_DISPLAY_SUNTON_8048S043=1
    -D HUB_TARGET_SUNTON_8048S043=1
    -D HUB_JS_SANDBOX=1
    -D HUB_CC_DCCEX=1

[platformio]
default_envs = piko-handheld
src_dir = src

[env:piko-handheld]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; PIKO SmartControl WLAN handheld: ESP32-WROOM-32E / 16MB flash.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = dio

; Do not enable automatic firmware upload before the original flash backup
; and hardware pin mapping have been verified.
